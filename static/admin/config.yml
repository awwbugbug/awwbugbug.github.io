backend:
  name: github
  repo: awwbugbug/awwbugbug.github.io
  branch: main
  auth_type: pkce

locale: zh_Hans

media_folder: static/images
public_folder: /images

collections:
  - name: posts
    label: "博客文章"
    folder: content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: title, widget: string }
      - { label: "发布日期", name: date, widget: datetime }
      - { label: "草稿", name: draft, widget: boolean, default: false }
      - { label: "标签", name: tags, widget: list, allow_add: true, required: false }
      - { label: "分类", name: categories, widget: list, allow_add: true, required: false }
      - { label: "摘要", name: summary, widget: string, required: false }
      - { label: "正文", name: body, widget: markdown }

  - name: project-details
    label: "项目详情"
    folder: content/project-details
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: title, widget: string }
      - { label: "URL", name: url, widget: string, required: false }
      - { label: "草稿", name: draft, widget: boolean, default: false }
      - { label: "正文", name: body, widget: markdown }
