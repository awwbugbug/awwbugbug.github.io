<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>ZDZ Blog - 内容管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
    .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; max-width: 400px; width: 100%; text-align: center; }
    .login-card h2 { font-size: 24px; margin-bottom: 8px; }
    .login-card .subtitle { color: #999; font-size: 14px; margin-bottom: 24px; }
    .login-card input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; margin-bottom: 16px; }
    .login-card input:focus { border-color: rgba(100,149,237,0.6); }
    .login-card button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #4a6cf7; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .login-card button:hover { background: #3b5de7; }
    .login-card .help { margin-top: 16px; font-size: 12px; color: #888; }
    .login-card .help a { color: #6c9bff; text-decoration: none; }
    .login-card .help a:hover { text-decoration: underline; }
    .logout-bar { position: fixed; top: 12px; right: 16px; z-index: 99999; }
    .logout-bar button { padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: #ccc; font-size: 12px; cursor: pointer; }
    .logout-bar button:hover { background: rgba(200,50,50,0.5); color: #fff; }
  </style>
  <script>
    (function() {
      var token = localStorage.getItem('cms-github-token');
      if (token) {
        localStorage.setItem('netlify-cms-user', JSON.stringify({
          token: token,
          backendName: 'github'
        }));
      } else {
        window.__showLogin = true;
      }
    })();
  </script>
</head>
<body>
  <script>
    if (window.__showLogin) {
      document.write(
        '<div class="login-wrapper"><div class="login-card">' +
        '<h2>ZDZ Blog 管理后台</h2>' +
        '<p class="subtitle">请输入 GitHub Personal Access Token 登录</p>' +
        '<input id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxx" />' +
        '<button onclick="doLogin()">登录</button>' +
        '<p class="help">需要 <code>repo</code> 权限 · ' +
        '<a href="https://github.com/settings/tokens/new?scopes=repo&description=ZDZ+Blog+CMS" target="_blank" rel="noopener">创建 Token</a></p>' +
        '</div></div>'
      );
    } else {
      document.write(
        '<div class="logout-bar"><button onclick="doLogout()">退出管理</button></div>'
      );
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(s);
    }

    function doLogin() {
      var token = document.getElementById('token-input').value.trim();
      if (token) {
        localStorage.setItem('cms-github-token', token);
        window.location.reload();
      }
    }

    function doLogout() {
      localStorage.removeItem('cms-github-token');
      localStorage.removeItem('netlify-cms-user');
      window.location.reload();
    }
  </script>
</body>
</html>
