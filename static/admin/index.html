<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>ZDZ Blog - 内容管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
    .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; max-width: 420px; width: 100%; text-align: center; }
    .login-card h2 { font-size: 24px; margin-bottom: 8px; }
    .login-card .subtitle { color: #999; font-size: 14px; margin-bottom: 24px; }
    .login-card input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; margin-bottom: 16px; }
    .login-card input:focus { border-color: rgba(100,149,237,0.6); }
    .login-card .btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #4a6cf7; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .login-card .btn:hover { background: #3b5de7; }
    .login-card .btn:disabled { background: #555; cursor: wait; }
    .login-card .help { margin-top: 16px; font-size: 12px; color: #888; }
    .login-card .help a { color: #6c9bff; text-decoration: none; }
    .login-card .help a:hover { text-decoration: underline; }
    .login-card .error { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; display: none; }
    .logout-bar { position: fixed; top: 12px; right: 16px; z-index: 99999; }
    .logout-bar button { padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: #ccc; font-size: 12px; cursor: pointer; backdrop-filter: blur(10px); }
    .logout-bar button:hover { background: rgba(200,50,50,0.5); color: #fff; }
    .loading { text-align: center; padding-top: 40vh; color: #888; font-size: 16px; }
  </style>
</head>
<body>

  <div id="login-page" style="display:none">
    <div class="login-wrapper">
      <div class="login-card">
        <h2>ZDZ Blog 管理后台</h2>
        <p class="subtitle">请输入 GitHub Personal Access Token 登录</p>
        <p class="error" id="login-error"></p>
        <input id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxx" />
        <button class="btn" id="login-btn" onclick="doLogin()">登录</button>
        <p class="help">
          需要 <code>repo</code> 权限 ·
          <a href="https://github.com/settings/tokens/new?scopes=repo&description=ZDZ+Blog+CMS" target="_blank" rel="noopener">创建 Token</a>
        </p>
      </div>
    </div>
  </div>

  <div id="cms-page" style="display:none">
    <div class="logout-bar"><button onclick="doLogout()">退出管理</button></div>
    <div class="loading" id="cms-loading">正在加载管理后台…</div>
  </div>

  <script>
    var token = localStorage.getItem('cms-github-token');

    if (!token) {
      document.getElementById('login-page').style.display = '';
    } else {
      loadCMS(token);
    }

    function doLogin() {
      var input = document.getElementById('token-input').value.trim();
      var errEl = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');
      if (!input) return;

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '验证中…';

      fetch('https://api.github.com/repos/awwbugbug/awwbugbug.github.io', {
        headers: { 'Authorization': 'token ' + input }
      }).then(function(r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function(data) {
        if (!data.permissions || !data.permissions.push) {
          throw new Error('no-push');
        }
        localStorage.setItem('cms-github-token', input);
        loadCMS(input);
      }).catch(function(e) {
        btn.disabled = false;
        btn.textContent = '登录';
        errEl.style.display = '';
        if (e.message === '401') {
          errEl.textContent = 'Token 无效，请检查后重试';
        } else if (e.message === 'no-push') {
          errEl.textContent = 'Token 没有此仓库的写入权限';
        } else {
          errEl.textContent = '验证失败: ' + e.message;
        }
      });
    }

    function loadCMS(tkn) {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('cms-page').style.display = '';

      localStorage.setItem('netlify-cms-user', JSON.stringify({
        token: tkn,
        name: 'Admin',
        login: 'awwbugbug',
        avatar_url: '',
        backendName: 'github'
      }));

      window.CMS_MANUAL_INIT = true;

      var s = document.createElement('script');
      s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      s.onload = function() {
        document.getElementById('cms-loading').style.display = 'none';
        if (window.CMS) {
          window.CMS.init();
        }
      };
      s.onerror = function() {
        document.getElementById('cms-loading').textContent = '加载失败，请刷新重试';
      };
      document.head.appendChild(s);
    }

    function doLogout() {
      localStorage.removeItem('cms-github-token');
      localStorage.removeItem('netlify-cms-user');
      window.location.reload();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && document.getElementById('token-input') === document.activeElement) {
        doLogin();
      }
    });
  </script>
</body>
</html>
